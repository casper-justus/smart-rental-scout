name: tenantmatch_app
description: TenantMatch – AI-powered rental matching app.
publish_to: 'none'
version: 0.0.4+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  cached_network_image: ^3.4.1
  flutter_map_cancellable_tile_provider: ^3.1.0
  panorama_viewer: ^2.0.7
  path_provider: ^2.1.1
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "icon_foreground.png"
  adaptive_icon_background: "#031636"
  adaptive_icon_foreground: "icon_foreground.png"

flutter:
  uses-material-design: true
